name: trade-prod

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:${PROD_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
      DATABASE_URL: ${PROD_DATABASE_URL:-postgresql+psycopg://trade:trade_prod_change_me@postgres:5432/trade_research}
      REDIS_URL: ${PROD_REDIS_URL:-redis://redis:6379/0}
      INGESTION_PROFILE: prod
      PROVIDER_RATE_LIMIT_BACKEND: redis
      PROVIDER_RATE_LIMIT_REQUIRE_REDIS: "true"
      UPSTOX_HISTORICAL_CONCURRENCY: ${PROD_UPSTOX_HISTORICAL_CONCURRENCY:-10}
      UPSTOX_RATE_PER_SECOND: ${PROD_UPSTOX_RATE_PER_SECOND:-40}
      UPSTOX_RATE_PER_MINUTE: ${PROD_UPSTOX_RATE_PER_MINUTE:-400}
      UPSTOX_RATE_PER_30_MINUTES: ${PROD_UPSTOX_RATE_PER_30_MINUTES:-1600}
      QDRANT_URL: http://qdrant:6333
      API_CORS_ORIGINS: ${PROD_API_CORS_ORIGINS:-http://localhost:8080}
      CHAT_RATE_LIMIT_TRUST_FORWARDED_FOR: ${PROD_CHAT_RATE_LIMIT_TRUST_FORWARDED_FOR:-true}
      UPSTOX_ACCESS_TOKEN: ${PROD_UPSTOX_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${PROD_OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${PROD_OPENAI_BASE_URL:-https://api.openai.com/v1}
      GEMINI_API_KEY: ${PROD_GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${PROD_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      QDRANT_API_KEY: ${PROD_QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${PROD_QDRANT_COLLECTION:-market_research_documents}
      APP_SECRET_KEY: ${PROD_APP_SECRET_KEY:-}
      ADMIN_EMAILS: ${PROD_ADMIN_EMAILS:-}
      ADMIN_EMAIL_HEADERS: ${PROD_ADMIN_EMAIL_HEADERS:-cf-access-authenticated-user-email,x-forwarded-email,x-authenticated-user-email}
      CHAT_ENABLED: ${PROD_CHAT_ENABLED:-true}
      CHAT_STRICT_CITATION_REQUIRED: ${PROD_CHAT_STRICT_CITATION_REQUIRED:-true}
      CHAT_USE_LLM_ANSWER: ${PROD_CHAT_USE_LLM_ANSWER:-true}
      CHAT_ANSWER_MODEL: ${PROD_CHAT_ANSWER_MODEL:-gemini-2.5-flash}
      CHAT_PLANNER_MODEL: ${PROD_CHAT_PLANNER_MODEL:-gemini-2.5-flash}
      CHAT_RATE_LIMIT_ENABLED: ${PROD_CHAT_RATE_LIMIT_ENABLED:-true}
      CHAT_RATE_LIMIT_REQUESTS: ${PROD_CHAT_RATE_LIMIT_REQUESTS:-12}
      CHAT_RATE_LIMIT_WINDOW_SECONDS: ${PROD_CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
      DATA_PIPELINE_MAX_CONCURRENT_FETCHES: ${PROD_DATA_PIPELINE_MAX_CONCURRENT_FETCHES:-1}
      DATA_PIPELINE_THROTTLE_SECONDS: ${PROD_DATA_PIPELINE_THROTTLE_SECONDS:-0}
      YFINANCE_DAILY_ENABLED: ${PROD_YFINANCE_DAILY_ENABLED:-false}
      YFINANCE_ADAPTIVE_RATE_MODE: ${PROD_YFINANCE_ADAPTIVE_RATE_MODE:-observe}
      YFINANCE_INITIAL_RPM: ${PROD_YFINANCE_INITIAL_RPM:-300}
      YFINANCE_MINIMUM_RPM: ${PROD_YFINANCE_MINIMUM_RPM:-30}
      YFINANCE_MAXIMUM_RPM: ${PROD_YFINANCE_MAXIMUM_RPM:-600}
      YFINANCE_INITIAL_CONCURRENCY: ${PROD_YFINANCE_INITIAL_CONCURRENCY:-4}
      YFINANCE_MAXIMUM_CONCURRENCY: ${PROD_YFINANCE_MAXIMUM_CONCURRENCY:-8}
      YFINANCE_IMMEDIATE_RETRY_ATTEMPTS: ${PROD_YFINANCE_IMMEDIATE_RETRY_ATTEMPTS:-3}
      YFINANCE_RETRY_WAIT_MULTIPLIER_SECONDS: ${PROD_YFINANCE_RETRY_WAIT_MULTIPLIER_SECONDS:-2}
      YFINANCE_RETRY_WAIT_MAX_SECONDS: ${PROD_YFINANCE_RETRY_WAIT_MAX_SECONDS:-15}
      YFINANCE_ADAPTIVE_EVALUATION_WINDOW_SECONDS: ${PROD_YFINANCE_ADAPTIVE_EVALUATION_WINDOW_SECONDS:-60}
      YFINANCE_ADAPTIVE_HEALTHY_WINDOWS_BEFORE_INCREASE: ${PROD_YFINANCE_ADAPTIVE_HEALTHY_WINDOWS_BEFORE_INCREASE:-2}
      YFINANCE_ADAPTIVE_INCREASE_RPM: ${PROD_YFINANCE_ADAPTIVE_INCREASE_RPM:-30}
      YFINANCE_ADAPTIVE_ERROR_THRESHOLD: ${PROD_YFINANCE_ADAPTIVE_ERROR_THRESHOLD:-0.10}
      YFINANCE_ADAPTIVE_COOLDOWN_SECONDS: ${PROD_YFINANCE_ADAPTIVE_COOLDOWN_SECONDS:-60}
      MATERIALIZED_EXCHANGE_SESSIONS_ENABLED: ${PROD_MATERIALIZED_EXCHANGE_SESSIONS_ENABLED:-false}
      EXCHANGE_SESSION_HISTORY_YEARS: ${PROD_EXCHANGE_SESSION_HISTORY_YEARS:-10}
      EXCHANGE_SESSION_FUTURE_YEARS: ${PROD_EXCHANGE_SESSION_FUTURE_YEARS:-1}
      EXCHANGE_SESSION_MINIMUM_OPEN_DAYS_PER_YEAR: ${PROD_EXCHANGE_SESSION_MINIMUM_OPEN_DAYS_PER_YEAR:-220}
      EXCHANGE_SESSION_MAXIMUM_OPEN_DAYS_PER_YEAR: ${PROD_EXCHANGE_SESSION_MAXIMUM_OPEN_DAYS_PER_YEAR:-260}
      EXCHANGE_SESSION_SHADOW_MAX_DISCREPANCIES: ${PROD_EXCHANGE_SESSION_SHADOW_MAX_DISCREPANCIES:-5}
      EXCHANGE_SESSION_OBSERVED_OPEN_MINIMUM_INSTRUMENTS: ${PROD_EXCHANGE_SESSION_OBSERVED_OPEN_MINIMUM_INSTRUMENTS:-10}
    volumes:
      - ${PROD_TRADE_DATA_DIR:-./data}:/app/data
      - ${PROD_TRADE_ARTIFACTS_DIR:-./artifacts}:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["dagster-daemon", "run", "-w", "/app/dagster_home/workspace.yaml"]
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
      DAGSTER_HOME: /app/dagster_home
      DATABASE_URL: ${PROD_DATABASE_URL:-postgresql+psycopg://trade:trade_prod_change_me@postgres:5432/trade_research}
      REDIS_URL: ${PROD_REDIS_URL:-redis://redis:6379/0}
      INGESTION_PROFILE: prod
      PROVIDER_RATE_LIMIT_BACKEND: redis
      PROVIDER_RATE_LIMIT_REQUIRE_REDIS: "true"
      UPSTOX_HISTORICAL_CONCURRENCY: ${PROD_UPSTOX_HISTORICAL_CONCURRENCY:-10}
      UPSTOX_RATE_PER_SECOND: ${PROD_UPSTOX_RATE_PER_SECOND:-40}
      UPSTOX_RATE_PER_MINUTE: ${PROD_UPSTOX_RATE_PER_MINUTE:-400}
      UPSTOX_RATE_PER_30_MINUTES: ${PROD_UPSTOX_RATE_PER_30_MINUTES:-1600}
      QDRANT_URL: http://qdrant:6333
      UPSTOX_ACCESS_TOKEN: ${PROD_UPSTOX_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${PROD_OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${PROD_GEMINI_API_KEY:-}
      APP_SECRET_KEY: ${PROD_APP_SECRET_KEY:-}
      ADMIN_EMAILS: ${PROD_ADMIN_EMAILS:-}
      ADMIN_EMAIL_HEADERS: ${PROD_ADMIN_EMAIL_HEADERS:-cf-access-authenticated-user-email,x-forwarded-email,x-authenticated-user-email}
      DATA_PIPELINE_MAX_CONCURRENT_FETCHES: ${PROD_DATA_PIPELINE_MAX_CONCURRENT_FETCHES:-1}
      DATA_PIPELINE_THROTTLE_SECONDS: ${PROD_DATA_PIPELINE_THROTTLE_SECONDS:-0}
      YFINANCE_DAILY_ENABLED: ${PROD_YFINANCE_DAILY_ENABLED:-false}
      YFINANCE_ADAPTIVE_RATE_MODE: ${PROD_YFINANCE_ADAPTIVE_RATE_MODE:-observe}
      YFINANCE_INITIAL_RPM: ${PROD_YFINANCE_INITIAL_RPM:-300}
      YFINANCE_MINIMUM_RPM: ${PROD_YFINANCE_MINIMUM_RPM:-30}
      YFINANCE_MAXIMUM_RPM: ${PROD_YFINANCE_MAXIMUM_RPM:-600}
      YFINANCE_INITIAL_CONCURRENCY: ${PROD_YFINANCE_INITIAL_CONCURRENCY:-4}
      YFINANCE_MAXIMUM_CONCURRENCY: ${PROD_YFINANCE_MAXIMUM_CONCURRENCY:-8}
      YFINANCE_IMMEDIATE_RETRY_ATTEMPTS: ${PROD_YFINANCE_IMMEDIATE_RETRY_ATTEMPTS:-3}
      YFINANCE_RETRY_WAIT_MULTIPLIER_SECONDS: ${PROD_YFINANCE_RETRY_WAIT_MULTIPLIER_SECONDS:-2}
      YFINANCE_RETRY_WAIT_MAX_SECONDS: ${PROD_YFINANCE_RETRY_WAIT_MAX_SECONDS:-15}
      YFINANCE_ADAPTIVE_EVALUATION_WINDOW_SECONDS: ${PROD_YFINANCE_ADAPTIVE_EVALUATION_WINDOW_SECONDS:-60}
      YFINANCE_ADAPTIVE_HEALTHY_WINDOWS_BEFORE_INCREASE: ${PROD_YFINANCE_ADAPTIVE_HEALTHY_WINDOWS_BEFORE_INCREASE:-2}
      YFINANCE_ADAPTIVE_INCREASE_RPM: ${PROD_YFINANCE_ADAPTIVE_INCREASE_RPM:-30}
      YFINANCE_ADAPTIVE_ERROR_THRESHOLD: ${PROD_YFINANCE_ADAPTIVE_ERROR_THRESHOLD:-0.10}
      YFINANCE_ADAPTIVE_COOLDOWN_SECONDS: ${PROD_YFINANCE_ADAPTIVE_COOLDOWN_SECONDS:-60}
      MATERIALIZED_EXCHANGE_SESSIONS_ENABLED: ${PROD_MATERIALIZED_EXCHANGE_SESSIONS_ENABLED:-false}
      EXCHANGE_SESSION_HISTORY_YEARS: ${PROD_EXCHANGE_SESSION_HISTORY_YEARS:-10}
      EXCHANGE_SESSION_FUTURE_YEARS: ${PROD_EXCHANGE_SESSION_FUTURE_YEARS:-1}
      EXCHANGE_SESSION_MINIMUM_OPEN_DAYS_PER_YEAR: ${PROD_EXCHANGE_SESSION_MINIMUM_OPEN_DAYS_PER_YEAR:-220}
      EXCHANGE_SESSION_MAXIMUM_OPEN_DAYS_PER_YEAR: ${PROD_EXCHANGE_SESSION_MAXIMUM_OPEN_DAYS_PER_YEAR:-260}
      EXCHANGE_SESSION_SHADOW_MAX_DISCREPANCIES: ${PROD_EXCHANGE_SESSION_SHADOW_MAX_DISCREPANCIES:-5}
      EXCHANGE_SESSION_OBSERVED_OPEN_MINIMUM_INSTRUMENTS: ${PROD_EXCHANGE_SESSION_OBSERVED_OPEN_MINIMUM_INSTRUMENTS:-10}
    volumes:
      - ${PROD_TRADE_DATA_DIR:-./data}:/app/data
      - ${PROD_TRADE_ARTIFACTS_DIR:-./artifacts}:/app/artifacts
      - ${PROD_DAGSTER_HOME_DIR:-./dagster_home}:/app/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.api
    command:
      [
        "dagster-webserver",
        "-h",
        "0.0.0.0",
        "-p",
        "3000",
        "-w",
        "/app/dagster_home/workspace.yaml",
      ]
    profiles:
      - admin
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
      DAGSTER_HOME: /app/dagster_home
      DATABASE_URL: ${PROD_DATABASE_URL:-postgresql+psycopg://trade:trade_prod_change_me@postgres:5432/trade_research}
      REDIS_URL: ${PROD_REDIS_URL:-redis://redis:6379/0}
      INGESTION_PROFILE: prod
      PROVIDER_RATE_LIMIT_BACKEND: redis
      PROVIDER_RATE_LIMIT_REQUIRE_REDIS: "true"
      UPSTOX_HISTORICAL_CONCURRENCY: ${PROD_UPSTOX_HISTORICAL_CONCURRENCY:-10}
      UPSTOX_RATE_PER_SECOND: ${PROD_UPSTOX_RATE_PER_SECOND:-40}
      UPSTOX_RATE_PER_MINUTE: ${PROD_UPSTOX_RATE_PER_MINUTE:-400}
      UPSTOX_RATE_PER_30_MINUTES: ${PROD_UPSTOX_RATE_PER_30_MINUTES:-1600}
      QDRANT_URL: http://qdrant:6333
      UPSTOX_ACCESS_TOKEN: ${PROD_UPSTOX_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${PROD_OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${PROD_GEMINI_API_KEY:-}
      APP_SECRET_KEY: ${PROD_APP_SECRET_KEY:-}
      ADMIN_EMAILS: ${PROD_ADMIN_EMAILS:-}
      ADMIN_EMAIL_HEADERS: ${PROD_ADMIN_EMAIL_HEADERS:-cf-access-authenticated-user-email,x-forwarded-email,x-authenticated-user-email}
      YFINANCE_DAILY_ENABLED: ${PROD_YFINANCE_DAILY_ENABLED:-false}
      YFINANCE_ADAPTIVE_RATE_MODE: ${PROD_YFINANCE_ADAPTIVE_RATE_MODE:-observe}
      YFINANCE_INITIAL_RPM: ${PROD_YFINANCE_INITIAL_RPM:-300}
      YFINANCE_MINIMUM_RPM: ${PROD_YFINANCE_MINIMUM_RPM:-30}
      YFINANCE_MAXIMUM_RPM: ${PROD_YFINANCE_MAXIMUM_RPM:-600}
      YFINANCE_INITIAL_CONCURRENCY: ${PROD_YFINANCE_INITIAL_CONCURRENCY:-4}
      YFINANCE_MAXIMUM_CONCURRENCY: ${PROD_YFINANCE_MAXIMUM_CONCURRENCY:-8}
      YFINANCE_IMMEDIATE_RETRY_ATTEMPTS: ${PROD_YFINANCE_IMMEDIATE_RETRY_ATTEMPTS:-3}
      YFINANCE_RETRY_WAIT_MULTIPLIER_SECONDS: ${PROD_YFINANCE_RETRY_WAIT_MULTIPLIER_SECONDS:-2}
      YFINANCE_RETRY_WAIT_MAX_SECONDS: ${PROD_YFINANCE_RETRY_WAIT_MAX_SECONDS:-15}
      YFINANCE_ADAPTIVE_EVALUATION_WINDOW_SECONDS: ${PROD_YFINANCE_ADAPTIVE_EVALUATION_WINDOW_SECONDS:-60}
      YFINANCE_ADAPTIVE_HEALTHY_WINDOWS_BEFORE_INCREASE: ${PROD_YFINANCE_ADAPTIVE_HEALTHY_WINDOWS_BEFORE_INCREASE:-2}
      YFINANCE_ADAPTIVE_INCREASE_RPM: ${PROD_YFINANCE_ADAPTIVE_INCREASE_RPM:-30}
      YFINANCE_ADAPTIVE_ERROR_THRESHOLD: ${PROD_YFINANCE_ADAPTIVE_ERROR_THRESHOLD:-0.10}
      YFINANCE_ADAPTIVE_COOLDOWN_SECONDS: ${PROD_YFINANCE_ADAPTIVE_COOLDOWN_SECONDS:-60}
      MATERIALIZED_EXCHANGE_SESSIONS_ENABLED: ${PROD_MATERIALIZED_EXCHANGE_SESSIONS_ENABLED:-false}
      EXCHANGE_SESSION_HISTORY_YEARS: ${PROD_EXCHANGE_SESSION_HISTORY_YEARS:-10}
      EXCHANGE_SESSION_FUTURE_YEARS: ${PROD_EXCHANGE_SESSION_FUTURE_YEARS:-1}
      EXCHANGE_SESSION_MINIMUM_OPEN_DAYS_PER_YEAR: ${PROD_EXCHANGE_SESSION_MINIMUM_OPEN_DAYS_PER_YEAR:-220}
      EXCHANGE_SESSION_MAXIMUM_OPEN_DAYS_PER_YEAR: ${PROD_EXCHANGE_SESSION_MAXIMUM_OPEN_DAYS_PER_YEAR:-260}
      EXCHANGE_SESSION_SHADOW_MAX_DISCREPANCIES: ${PROD_EXCHANGE_SESSION_SHADOW_MAX_DISCREPANCIES:-5}
      EXCHANGE_SESSION_OBSERVED_OPEN_MINIMUM_INSTRUMENTS: ${PROD_EXCHANGE_SESSION_OBSERVED_OPEN_MINIMUM_INSTRUMENTS:-10}
    ports:
      - "127.0.0.1:${PROD_DAGSTER_WEB_PORT:-3000}:3000"
    volumes:
      - ${PROD_TRADE_DATA_DIR:-./data}:/app/data
      - ${PROD_TRADE_ARTIFACTS_DIR:-./artifacts}:/app/artifacts
      - ${PROD_DAGSTER_HOME_DIR:-./dagster_home}:/app/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${PROD_POSTGRES_DB:-trade_research}
      POSTGRES_USER: ${PROD_POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:-trade_prod_change_me}
    volumes:
      - ${PROD_POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_POSTGRES_USER:-trade} -d ${PROD_POSTGRES_DB:-trade_research}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${PROD_REDIS_DATA_DIR:-./data/redis}:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ${PROD_QDRANT_DATA_DIR:-./data/qdrant}:/qdrant/storage
    restart: unless-stopped
