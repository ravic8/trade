services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      LENS_DOMAIN: ${LENS_DOMAIN:?Set LENS_DOMAIN in .env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  api:
    image: trade-research-api:prod
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATA_DIR: ${DATA_DIR:-/app/data}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prod}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-market_research_documents}
      CHAT_ENABLED: ${CHAT_ENABLED:-true}
      CHAT_USE_LLM_ANSWER: ${CHAT_USE_LLM_ANSWER:-false}
      CHAT_STRICT_CITATION_REQUIRED: ${CHAT_STRICT_CITATION_REQUIRED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_REFERER: ${OPENROUTER_REFERER:-}
      OPENROUTER_TITLE: ${OPENROUTER_TITLE:-trade-research}
      CHAT_ANSWER_MODEL: ${CHAT_ANSWER_MODEL:-gpt-5.5}
      CHAT_PLANNER_MODEL: ${CHAT_PLANNER_MODEL:-gpt-5.4-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      YFINANCE_BATCH_SIZE: ${YFINANCE_BATCH_SIZE:-20}
      YFINANCE_THROTTLE_SECONDS: ${YFINANCE_THROTTLE_SECONDS:-1}
      YFINANCE_MAX_WORKERS: ${YFINANCE_MAX_WORKERS:-2}
      YFINANCE_RETRY_ATTEMPTS: ${YFINANCE_RETRY_ATTEMPTS:-3}
      YFINANCE_RETRY_BASE_SECONDS: ${YFINANCE_RETRY_BASE_SECONDS:-1}
      YFINANCE_JITTER_SECONDS: ${YFINANCE_JITTER_SECONDS:-0.5}
      HOURLY_REALTIME_LOOKBACK_DAYS: ${HOURLY_REALTIME_LOOKBACK_DAYS:-1}
      HOURLY_HISTORY_LOOKBACK_DAYS: ${HOURLY_HISTORY_LOOKBACK_DAYS:-10}
      HOURLY_BACKLOG_ENABLED: ${HOURLY_BACKLOG_ENABLED:-true}
      HOURLY_BACKLOG_SCAN_DAYS: ${HOURLY_BACKLOG_SCAN_DAYS:-10}
      HOURLY_BACKLOG_COVERAGE_THRESHOLD: ${HOURLY_BACKLOG_COVERAGE_THRESHOLD:-0.5}
      HOURLY_BACKLOG_MAX_WINDOWS_PER_TICK: ${HOURLY_BACKLOG_MAX_WINDOWS_PER_TICK:-1}
      HOURLY_BACKLOG_MAX_ATTEMPTS: ${HOURLY_BACKLOG_MAX_ATTEMPTS:-3}
      HOURLY_BACKLOG_MIN_CANDLE_LAG_MINUTES: ${HOURLY_BACKLOG_MIN_CANDLE_LAG_MINUTES:-20}
      HOURLY_BACKLOG_STALE_RECOVERY_MINUTES: ${HOURLY_BACKLOG_STALE_RECOVERY_MINUTES:-30}
      UNIVERSE_REFRESH_DAYS: ${UNIVERSE_REFRESH_DAYS:-7}
      CALENDAR_REFRESH_DAYS: ${CALENDAR_REFRESH_DAYS:-30}
      FEED_HEALTH_FAILURE_THRESHOLD: ${FEED_HEALTH_FAILURE_THRESHOLD:-5}
      FEED_HEALTH_MAX_BACKOFF_HOURS: ${FEED_HEALTH_MAX_BACKOFF_HOURS:-24}
      FEED_HEALTH_UNSUPPORTED_RETRY_DAYS: ${FEED_HEALTH_UNSUPPORTED_RETRY_DAYS:-7}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  dagster-webserver:
    image: trade-research-api:prod
    pull_policy: never
    command:
      [
        "dagster-webserver",
        "-h",
        "0.0.0.0",
        "-p",
        "3000",
        "-w",
        "/app/dagster_home/workspace.yaml",
      ]
    environment: &dagster_environment
      APP_ENV: ${APP_ENV:-production}
      DATA_DIR: ${DATA_DIR:-/app/data}
      DAGSTER_HOME: /app/dagster_home
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prod}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      YFINANCE_BATCH_SIZE: ${YFINANCE_BATCH_SIZE:-20}
      YFINANCE_THROTTLE_SECONDS: ${YFINANCE_THROTTLE_SECONDS:-1}
      YFINANCE_MAX_WORKERS: ${YFINANCE_MAX_WORKERS:-2}
      YFINANCE_RETRY_ATTEMPTS: ${YFINANCE_RETRY_ATTEMPTS:-3}
      YFINANCE_RETRY_BASE_SECONDS: ${YFINANCE_RETRY_BASE_SECONDS:-1}
      YFINANCE_JITTER_SECONDS: ${YFINANCE_JITTER_SECONDS:-0.5}
      HOURLY_REALTIME_LOOKBACK_DAYS: ${HOURLY_REALTIME_LOOKBACK_DAYS:-1}
      HOURLY_HISTORY_LOOKBACK_DAYS: ${HOURLY_HISTORY_LOOKBACK_DAYS:-10}
      HOURLY_BACKLOG_ENABLED: ${HOURLY_BACKLOG_ENABLED:-true}
      HOURLY_BACKLOG_SCAN_DAYS: ${HOURLY_BACKLOG_SCAN_DAYS:-10}
      HOURLY_BACKLOG_COVERAGE_THRESHOLD: ${HOURLY_BACKLOG_COVERAGE_THRESHOLD:-0.5}
      HOURLY_BACKLOG_MAX_WINDOWS_PER_TICK: ${HOURLY_BACKLOG_MAX_WINDOWS_PER_TICK:-1}
      HOURLY_BACKLOG_MAX_ATTEMPTS: ${HOURLY_BACKLOG_MAX_ATTEMPTS:-3}
      HOURLY_BACKLOG_MIN_CANDLE_LAG_MINUTES: ${HOURLY_BACKLOG_MIN_CANDLE_LAG_MINUTES:-20}
      HOURLY_BACKLOG_STALE_RECOVERY_MINUTES: ${HOURLY_BACKLOG_STALE_RECOVERY_MINUTES:-30}
      UNIVERSE_REFRESH_DAYS: ${UNIVERSE_REFRESH_DAYS:-7}
      CALENDAR_REFRESH_DAYS: ${CALENDAR_REFRESH_DAYS:-30}
      FEED_HEALTH_FAILURE_THRESHOLD: ${FEED_HEALTH_FAILURE_THRESHOLD:-5}
      FEED_HEALTH_MAX_BACKOFF_HOURS: ${FEED_HEALTH_MAX_BACKOFF_HOURS:-24}
      FEED_HEALTH_UNSUPPORTED_RETRY_DAYS: ${FEED_HEALTH_UNSUPPORTED_RETRY_DAYS:-7}
    ports:
      - "${DAGSTER_HOST_BIND_IP:-127.0.0.1}:${DAGSTER_HOST_PORT:-3000}:3000"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  dagster-daemon:
    image: trade-research-api:prod
    pull_policy: never
    command: ["dagster-daemon", "run", "-w", "/app/dagster_home/workspace.yaml"]
    environment: *dagster_environment
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_research}
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  app_data:
  caddy_config:
  caddy_data:
  postgres_data:
  qdrant_data:
  redis_data:
