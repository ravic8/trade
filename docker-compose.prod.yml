      UPSTOX_RATE_PER_30_MINUTES: ${PROD_UPSTOX_RATE_PER_30_MINUTES:-1600}
      UPSTOX_ACCESS_TOKEN: ${PROD_UPSTOX_ACCESS_TOKEN:-}
      APP_SECRET_KEY: ${PROD_APP_SECRET_KEY:-}
      ADMIN_EMAILS: ${PROD_ADMIN_EMAILS:-}
      ADMIN_EMAIL_HEADERS: ${PROD_ADMIN_EMAIL_HEADERS:-cf-access-authenticated-user-email,x-forwarded-email,x-authenticated-user-email}
      YFINANCE_DAILY_ENABLED: ${PROD_YFINANCE_DAILY_ENABLED:-false}
      YFINANCE_DAILY_WORKER_EXCHANGE: ${PROD_YFINANCE_DAILY_WORKER_EXCHANGE:-NSE}
      YFINANCE_FULL_US_ENABLED: ${PROD_YFINANCE_FULL_US_ENABLED:-false}
      YFINANCE_FULL_TSX_ENABLED: ${PROD_YFINANCE_FULL_TSX_ENABLED:-false}
      YFINANCE_TSX_CANARY_ENABLED: ${PROD_YFINANCE_TSX_CANARY_ENABLED:-false}
      YFINANCE_TSX_CANARY_MAX_SYMBOLS: ${PROD_YFINANCE_TSX_CANARY_MAX_SYMBOLS:-100}
      YFINANCE_NSE_CANARY_ENABLED: ${PROD_YFINANCE_NSE_CANARY_ENABLED:-false}
      YFINANCE_NSE_CANARY_MAX_SYMBOLS: ${PROD_YFINANCE_NSE_CANARY_MAX_SYMBOLS:-100}
      YFINANCE_PROVIDER_HISTORY_EVIDENCE_ENABLED: ${PROD_YFINANCE_PROVIDER_HISTORY_EVIDENCE_ENABLED:-false}
      YFINANCE_SPARSE_HISTORY_MINIMUM_EXPECTED_ROWS: ${PROD_YFINANCE_SPARSE_HISTORY_MINIMUM_EXPECTED_ROWS:-220}
      YFINANCE_SPARSE_HISTORY_MAXIMUM_OBSERVED_ROWS: ${PROD_YFINANCE_SPARSE_HISTORY_MAXIMUM_OBSERVED_ROWS:-5}
      TSX_OFFICIAL_ISSUER_URL: ${PROD_TSX_OFFICIAL_ISSUER_URL:-https://www.tsx.com/en/resource/571}
      TSX_OFFICIAL_DIRECTORY_BASE_URL: ${PROD_TSX_OFFICIAL_DIRECTORY_BASE_URL:-https://www.tsx.com/json/company-directory}
      TSX_OFFICIAL_TIMEOUT_SECONDS: ${PROD_TSX_OFFICIAL_TIMEOUT_SECONDS:-30}
      TSX_OFFICIAL_RETRY_ATTEMPTS: ${PROD_TSX_OFFICIAL_RETRY_ATTEMPTS:-3}
      YFINANCE_NSE_ENABLED: ${PROD_YFINANCE_NSE_ENABLED:-false}
      NSE_DAILY_PRIMARY_SOURCE: ${PROD_NSE_DAILY_PRIMARY_SOURCE:-yfinance}
      NSE_PROVIDER_COMPARISON_SESSIONS: ${PROD_NSE_PROVIDER_COMPARISON_SESSIONS:-20}
      NSE_PROVIDER_COMPARISON_MINIMUM_SYMBOLS: ${PROD_NSE_PROVIDER_COMPARISON_MINIMUM_SYMBOLS:-100}
      NSE_PROVIDER_COMPARISON_MINIMUM_ROW_OVERLAP: ${PROD_NSE_PROVIDER_COMPARISON_MINIMUM_ROW_OVERLAP:-0.95}
      NSE_PROVIDER_COMPARISON_CLOSE_TOLERANCE: ${PROD_NSE_PROVIDER_COMPARISON_CLOSE_TOLERANCE:-0.01}
      NSE_PROVIDER_COMPARISON_MINIMUM_CLOSE_MATCH: ${PROD_NSE_PROVIDER_COMPARISON_MINIMUM_CLOSE_MATCH:-0.98}
      NSE_PROVIDER_COMPARISON_MAXIMUM_SESSION_LAG: ${PROD_NSE_PROVIDER_COMPARISON_MAXIMUM_SESSION_LAG:-1}
      LEGACY_UPSTOX_NSE_ENABLED: ${PROD_LEGACY_UPSTOX_NSE_ENABLED:-false}
      YFINANCE_ADAPTIVE_RATE_MODE: ${PROD_YFINANCE_ADAPTIVE_RATE_MODE:-observe}
      YFINANCE_INITIAL_RPM: ${PROD_YFINANCE_INITIAL_RPM:-300}
      YFINANCE_MINIMUM_RPM: ${PROD_YFINANCE_MINIMUM_RPM:-30}
      YFINANCE_MAXIMUM_RPM: ${PROD_YFINANCE_MAXIMUM_RPM:-600}
      YFINANCE_INITIAL_CONCURRENCY: ${PROD_YFINANCE_INITIAL_CONCURRENCY:-4}
      YFINANCE_MAXIMUM_CONCURRENCY: ${PROD_YFINANCE_MAXIMUM_CONCURRENCY:-8}
      YFINANCE_IMMEDIATE_RETRY_ATTEMPTS: ${PROD_YFINANCE_IMMEDIATE_RETRY_ATTEMPTS:-3}
      YFINANCE_RETRY_WAIT_MULTIPLIER_SECONDS: ${PROD_YFINANCE_RETRY_WAIT_MULTIPLIER_SECONDS:-2}
      YFINANCE_RETRY_WAIT_MAX_SECONDS: ${PROD_YFINANCE_RETRY_WAIT_MAX_SECONDS:-15}
      YFINANCE_NEW_LISTING_GRACE_HOURS: ${PROD_YFINANCE_NEW_LISTING_GRACE_HOURS:-72}
      YFINANCE_NEW_LISTING_RETRY_HOURS: ${PROD_YFINANCE_NEW_LISTING_RETRY_HOURS:-6}
      YFINANCE_PROVIDER_GRACE_MINUTES: ${PROD_YFINANCE_PROVIDER_GRACE_MINUTES:-120}
      YFINANCE_ADAPTIVE_EVALUATION_WINDOW_SECONDS: ${PROD_YFINANCE_ADAPTIVE_EVALUATION_WINDOW_SECONDS:-60}
      YFINANCE_ADAPTIVE_HEALTHY_WINDOWS_BEFORE_INCREASE: ${PROD_YFINANCE_ADAPTIVE_HEALTHY_WINDOWS_BEFORE_INCREASE:-2}
      YFINANCE_ADAPTIVE_INCREASE_RPM: ${PROD_YFINANCE_ADAPTIVE_INCREASE_RPM:-30}
      YFINANCE_ADAPTIVE_ERROR_THRESHOLD: ${PROD_YFINANCE_ADAPTIVE_ERROR_THRESHOLD:-0.10}
      YFINANCE_ADAPTIVE_COOLDOWN_SECONDS: ${PROD_YFINANCE_ADAPTIVE_COOLDOWN_SECONDS:-60}
      YFINANCE_BACKFILL_YEARS: ${PROD_YFINANCE_BACKFILL_YEARS:-10}
      YFINANCE_WORK_PLANNER_CHUNK_SIZE: ${PROD_YFINANCE_WORK_PLANNER_CHUNK_SIZE:-250}
      YFINANCE_WORK_CLAIM_SIZE: ${PROD_YFINANCE_WORK_CLAIM_SIZE:-100}
      YFINANCE_WORK_HEARTBEAT_SECONDS: ${PROD_YFINANCE_WORK_HEARTBEAT_SECONDS:-30}
      YFINANCE_WORK_STALE_MINUTES: ${PROD_YFINANCE_WORK_STALE_MINUTES:-10}
      YFINANCE_WORK_MAX_ATTEMPTS: ${PROD_YFINANCE_WORK_MAX_ATTEMPTS:-9}
      MATERIALIZED_EXCHANGE_SESSIONS_ENABLED: ${PROD_MATERIALIZED_EXCHANGE_SESSIONS_ENABLED:-false}
      EXCHANGE_SESSION_HISTORY_YEARS: ${PROD_EXCHANGE_SESSION_HISTORY_YEARS:-10}
      EXCHANGE_SESSION_FUTURE_YEARS: ${PROD_EXCHANGE_SESSION_FUTURE_YEARS:-1}
      EXCHANGE_SESSION_MINIMUM_OPEN_DAYS_PER_YEAR: ${PROD_EXCHANGE_SESSION_MINIMUM_OPEN_DAYS_PER_YEAR:-220}
      EXCHANGE_SESSION_MAXIMUM_OPEN_DAYS_PER_YEAR: ${PROD_EXCHANGE_SESSION_MAXIMUM_OPEN_DAYS_PER_YEAR:-260}
      EXCHANGE_SESSION_SHADOW_MAX_DISCREPANCIES: ${PROD_EXCHANGE_SESSION_SHADOW_MAX_DISCREPANCIES:-5}
      EXCHANGE_SESSION_OBSERVED_OPEN_MINIMUM_INSTRUMENTS: ${PROD_EXCHANGE_SESSION_OBSERVED_OPEN_MINIMUM_INSTRUMENTS:-10}
    ports:
      - "127.0.0.1:${PROD_DAGSTER_WEB_PORT:-3000}:3000"
    volumes:
      - ${PROD_TRADE_DATA_DIR:-./data}:/app/data
      - ${PROD_TRADE_ARTIFACTS_DIR:-./artifacts}:/app/artifacts
      - ${PROD_DAGSTER_HOME_DIR:-./dagster_home}:/app/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg16
    shm_size: ${PROD_POSTGRES_SHM_SIZE:-512mb}
    ports:
      - "127.0.0.1:${PROD_POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${PROD_POSTGRES_DB:-trade_research}
      POSTGRES_USER: ${PROD_POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:-trade_prod_change_me}
    volumes:
      - ${PROD_POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_POSTGRES_USER:-trade} -d ${PROD_POSTGRES_DB:-trade_research}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - analytics_access
    restart: unless-stopped

  clickhouse:
    image: ${PROD_CLICKHOUSE_IMAGE:-clickhouse:25.8.33.6-jammy}
    profiles: ["research"]
    environment:
      CLICKHOUSE_DB: research
      CLICKHOUSE_USER: ${PROD_CLICKHOUSE_ADMIN_USER:-admin}
      CLICKHOUSE_PASSWORD: ${PROD_CLICKHOUSE_ADMIN_PASSWORD:-phase2-disabled}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    expose:
      - "8123"
      - "9000"
    volumes:
      - ${PROD_CLICKHOUSE_DATA_DIR:-/opt/trade/clickhouse}:/var/lib/clickhouse
      - ./clickhouse/config.d/observability.xml:/etc/clickhouse-server/config.d/observability.xml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${PROD_CLICKHOUSE_MEMORY_LIMIT:-4g}
    cpus: ${PROD_CLICKHOUSE_CPU_LIMIT:-2.0}
    logging:
      driver: json-file
      options:
        max-size: ${PROD_CLICKHOUSE_LOG_MAX_SIZE:-50m}
        max-file: ${PROD_CLICKHOUSE_LOG_MAX_FILES:-5}
    restart: unless-stopped

  clickhouse-init:
    image: ${PROD_CLICKHOUSE_IMAGE:-clickhouse:25.8.33.6-jammy}
    profiles: ["research-setup"]
    environment:
      CLICKHOUSE_ADMIN_USER: ${PROD_CLICKHOUSE_ADMIN_USER:-admin}
      CLICKHOUSE_ADMIN_PASSWORD: ${PROD_CLICKHOUSE_ADMIN_PASSWORD:-phase2-disabled}
      CLICKHOUSE_MIGRATION_USER: ${PROD_CLICKHOUSE_MIGRATION_USER:-migration}
      CLICKHOUSE_MIGRATION_PASSWORD: ${PROD_CLICKHOUSE_MIGRATION_PASSWORD:-phase2-disabled}
      CLICKHOUSE_DAGSTER_USER: ${PROD_CLICKHOUSE_DAGSTER_USER:-dagster_writer}
      CLICKHOUSE_DAGSTER_PASSWORD: ${PROD_CLICKHOUSE_DAGSTER_PASSWORD:-phase2-disabled}
      CLICKHOUSE_API_USER: ${PROD_CLICKHOUSE_API_USER:-api_reader}
      CLICKHOUSE_API_PASSWORD: ${PROD_CLICKHOUSE_API_PASSWORD:-phase2-disabled}
      CLICKHOUSE_ANALYST_USER: ${PROD_CLICKHOUSE_ANALYST_USER:-analyst_reader}
      CLICKHOUSE_ANALYST_PASSWORD: ${PROD_CLICKHOUSE_ANALYST_PASSWORD:-phase2-disabled}
    volumes:
      - ./clickhouse/bootstrap-access.sh:/bootstrap-access.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-access.sh"]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"

  clickhouse-migrate:
    image: ${PROD_API_IMAGE:-trade-data-api:local}
    profiles: ["research-setup"]
    command: ["python", "/app/scripts/run_clickhouse_migrations.py"]
    environment:
      CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: research
      CLICKHOUSE_USERNAME: ${PROD_CLICKHOUSE_MIGRATION_USER:-migration}
      CLICKHOUSE_PASSWORD: ${PROD_CLICKHOUSE_MIGRATION_PASSWORD:-phase2-disabled}
      CLICKHOUSE_CONNECT_TIMEOUT_SECONDS: 10
      CLICKHOUSE_QUERY_TIMEOUT_SECONDS: 120
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${PROD_REDIS_DATA_DIR:-./data/redis}:/data
    restart: unless-stopped

  minio:
    # Keep the recovery default on the upgrade path used before Phase 2. The
    # deploy script snapshots the running image and rejects explicit release
    # downgrades before this service is recreated.
    image: ${PROD_MINIO_IMAGE:-trade-minio:RELEASE.2025-09-07T16-13-09Z}
    build:
      context: .
      dockerfile: minio/Dockerfile.minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PROD_MINIO_ROOT_USER:?set PROD_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${PROD_MINIO_ROOT_PASSWORD:?set PROD_MINIO_ROOT_PASSWORD}
    volumes:
      - ${PROD_MINIO_DATA_DIR:-/opt/trade/minio}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  minio-research-init:
    build:
      context: .
      dockerfile: minio/Dockerfile.mc
    image: ${PROD_MINIO_CLIENT_IMAGE:-trade-minio-mc:RELEASE.2025-08-13T08-35-41Z}
    profiles: ["research-setup"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${PROD_MINIO_ROOT_USER:-phase2-disabled}
      MINIO_ROOT_PASSWORD: ${PROD_MINIO_ROOT_PASSWORD:-phase2-disabled}
      RAW_BUCKET: ${PROD_OBJECT_STORE_RAW_BUCKET:-trade-raw}
      DATASETS_BUCKET: ${PROD_OBJECT_STORE_DATASETS_BUCKET:-trade-datasets}
      EXPORTS_BUCKET: ${PROD_OBJECT_STORE_EXPORTS_BUCKET:-trade-exports}
      DAGSTER_ACCESS_KEY: ${PROD_OBJECT_STORE_DAGSTER_ACCESS_KEY_ID:-phase2-disabled}
      DAGSTER_SECRET_KEY: ${PROD_OBJECT_STORE_DAGSTER_SECRET_ACCESS_KEY:-phase2-disabled}
      API_ACCESS_KEY: ${PROD_OBJECT_STORE_API_ACCESS_KEY_ID:-phase2-disabled}
      API_SECRET_KEY: ${PROD_OBJECT_STORE_API_SECRET_ACCESS_KEY:-phase2-disabled}
    volumes:
      - ./minio/bootstrap-research.sh:/bootstrap-research.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-research.sh"]
    restart: "no"

  otel-collector:
    image: ${PROD_OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:latest}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "9464"
    restart: unless-stopped

  prometheus:
    image: ${PROD_PROMETHEUS_IMAGE:-prom/prometheus:latest}
    user: ${PROD_PROMETHEUS_UID:-1000}:${PROD_PROMETHEUS_GID:-1000}
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yaml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=${PROD_PROMETHEUS_RETENTION:-30d}",
      ]
    volumes:
      - ./ops/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ${PROD_PROMETHEUS_DATA_DIR:-/opt/trade/prometheus}:/prometheus
    depends_on:
      otel-collector:
        condition: service_started
      alertmanager:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: ${PROD_ALERTMANAGER_IMAGE:-prom/alertmanager:latest}
    user: ${PROD_ALERTMANAGER_UID:-1000}:${PROD_ALERTMANAGER_GID:-1000}
    command:
      [
        "--config.file=/etc/alertmanager/alertmanager.yaml",
        "--storage.path=/alertmanager",
        "--web.listen-address=0.0.0.0:9093",
        "--cluster.listen-address=",
      ]
    volumes:
      - ./ops/observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - ${PROD_ALERTMANAGER_DATA_DIR:-/opt/trade/alertmanager}:/alertmanager
    expose:
      - "9093"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  analytics_access:
    internal: true
