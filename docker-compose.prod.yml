      EXCHANGE_SESSION_OBSERVED_OPEN_MINIMUM_INSTRUMENTS: ${PROD_EXCHANGE_SESSION_OBSERVED_OPEN_MINIMUM_INSTRUMENTS:-10}
    volumes:
      - ${PROD_TRADE_DATA_DIR:-./data}:/app/data
      - ${PROD_TRADE_ARTIFACTS_DIR:-./artifacts}:/app/artifacts
      - ${PROD_DAGSTER_HOME_DIR:-./dagster_home}:/app/dagster_readonly:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  dagster-daemon:
    image: ${PROD_API_IMAGE:-trade-data-api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["dagster-daemon", "run", "-w", "/app/dagster_home/workspace.yaml"]
    environment:
      <<: *research-write-environment
      APP_ENV: production
