services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://trade:trade@postgres:5432/trade_research
      QDRANT_URL: http://qdrant:6333
      CHAT_ENABLED: "true"
      CHAT_USE_LLM_ANSWER: "true"
      CHAT_STRICT_CITATION_REQUIRED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      CHAT_ANSWER_MODEL: ${CHAT_ANSWER_MODEL:-gemini-2.5-flash}
      CHAT_PLANNER_MODEL: ${CHAT_PLANNER_MODEL:-gemini-2.5-flash}
      CHAT_ANSWER_MAX_OUTPUT_TOKENS: ${CHAT_ANSWER_MAX_OUTPUT_TOKENS:-700}
      CHAT_LLM_TIMEOUT_SECONDS: ${CHAT_LLM_TIMEOUT_SECONDS:-20}
      CHAT_LLM_RETRY_ATTEMPTS: ${CHAT_LLM_RETRY_ATTEMPTS:-3}
      CHAT_LLM_RETRY_BASE_SECONDS: ${CHAT_LLM_RETRY_BASE_SECONDS:-0.5}
      CHAT_LLM_THINKING_BUDGET: ${CHAT_LLM_THINKING_BUDGET:-0}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
      CHAT_RATE_LIMIT_ENABLED: ${CHAT_RATE_LIMIT_ENABLED:-true}
      CHAT_RATE_LIMIT_REQUESTS: ${CHAT_RATE_LIMIT_REQUESTS:-12}
      CHAT_RATE_LIMIT_WINDOW_SECONDS: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
      CHAT_RATE_LIMIT_TRUST_FORWARDED_FOR: ${CHAT_RATE_LIMIT_TRUST_FORWARDED_FOR:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      YFINANCE_BATCH_SIZE: 20
      YFINANCE_THROTTLE_SECONDS: 1
      YFINANCE_MAX_WORKERS: 2
      YFINANCE_RETRY_ATTEMPTS: 3
      YFINANCE_RETRY_BASE_SECONDS: 1
      YFINANCE_JITTER_SECONDS: 0.5
      HOURLY_REALTIME_LOOKBACK_DAYS: 1
      HOURLY_HISTORY_LOOKBACK_DAYS: 10
      HOURLY_BACKLOG_ENABLED: "true"
      HOURLY_BACKLOG_SCAN_DAYS: 10
      HOURLY_BACKLOG_COVERAGE_THRESHOLD: 0.5
      HOURLY_BACKLOG_MAX_WINDOWS_PER_TICK: 1
      HOURLY_BACKLOG_MAX_ATTEMPTS: 3
      HOURLY_BACKLOG_MIN_CANDLE_LAG_MINUTES: 20
      HOURLY_BACKLOG_STALE_RECOVERY_MINUTES: 30
      UNIVERSE_REFRESH_DAYS: 7
      CALENDAR_REFRESH_DAYS: 30
      FEED_HEALTH_FAILURE_THRESHOLD: 5
      FEED_HEALTH_MAX_BACKOFF_HOURS: 24
      FEED_HEALTH_UNSUPPORTED_RETRY_DAYS: 7
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      - postgres
      - redis
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.api
    command:
      [
        "dagster-webserver",
        "-h",
        "0.0.0.0",
        "-p",
        "3000",
        "-w",
        "/app/dagster_home/workspace.yaml",
      ]
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DAGSTER_HOME: /app/dagster_home
      DATABASE_URL: postgresql+psycopg://trade:trade@postgres:5432/trade_research
      QDRANT_URL: http://qdrant:6333
      YFINANCE_BATCH_SIZE: 20
      YFINANCE_THROTTLE_SECONDS: 1
      YFINANCE_MAX_WORKERS: 2
      YFINANCE_RETRY_ATTEMPTS: 3
      YFINANCE_RETRY_BASE_SECONDS: 1
      YFINANCE_JITTER_SECONDS: 0.5
      HOURLY_REALTIME_LOOKBACK_DAYS: 1
      HOURLY_HISTORY_LOOKBACK_DAYS: 10
      HOURLY_BACKLOG_ENABLED: "true"
      HOURLY_BACKLOG_SCAN_DAYS: 10
      HOURLY_BACKLOG_COVERAGE_THRESHOLD: 0.5
      HOURLY_BACKLOG_MAX_WINDOWS_PER_TICK: 1
      HOURLY_BACKLOG_MAX_ATTEMPTS: 3
      HOURLY_BACKLOG_MIN_CANDLE_LAG_MINUTES: 20
      HOURLY_BACKLOG_STALE_RECOVERY_MINUTES: 30
      UNIVERSE_REFRESH_DAYS: 7
      CALENDAR_REFRESH_DAYS: 30
      FEED_HEALTH_FAILURE_THRESHOLD: 5
      FEED_HEALTH_MAX_BACKOFF_HOURS: 24
      FEED_HEALTH_UNSUPPORTED_RETRY_DAYS: 7
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/data
    depends_on:
      - postgres
      - qdrant

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["dagster-daemon", "run", "-w", "/app/dagster_home/workspace.yaml"]
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DAGSTER_HOME: /app/dagster_home
      DATABASE_URL: postgresql+psycopg://trade:trade@postgres:5432/trade_research
      QDRANT_URL: http://qdrant:6333
      YFINANCE_BATCH_SIZE: 20
      YFINANCE_THROTTLE_SECONDS: 1
      YFINANCE_MAX_WORKERS: 2
      YFINANCE_RETRY_ATTEMPTS: 3
      YFINANCE_RETRY_BASE_SECONDS: 1
      YFINANCE_JITTER_SECONDS: 0.5
      HOURLY_REALTIME_LOOKBACK_DAYS: 1
      HOURLY_HISTORY_LOOKBACK_DAYS: 10
      HOURLY_BACKLOG_ENABLED: "true"
      HOURLY_BACKLOG_SCAN_DAYS: 10
      HOURLY_BACKLOG_COVERAGE_THRESHOLD: 0.5
      HOURLY_BACKLOG_MAX_WINDOWS_PER_TICK: 1
      HOURLY_BACKLOG_MAX_ATTEMPTS: 3
      HOURLY_BACKLOG_MIN_CANDLE_LAG_MINUTES: 20
      HOURLY_BACKLOG_STALE_RECOVERY_MINUTES: 30
      UNIVERSE_REFRESH_DAYS: 7
      CALENDAR_REFRESH_DAYS: 30
      FEED_HEALTH_FAILURE_THRESHOLD: 5
      FEED_HEALTH_MAX_BACKOFF_HOURS: 24
      FEED_HEALTH_UNSUPPORTED_RETRY_DAYS: 7
    volumes:
      - app_data:/app/data
    depends_on:
      - postgres
      - qdrant

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: trade_research
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  dbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
      - "8978:8978"
    volumes:
      - dbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      - postgres
      - qdrant

volumes:
  app_data:
  postgres_data:
  qdrant_data:
  dbeaver_data:
