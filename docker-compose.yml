services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://trade:trade@postgres:5432/trade_research
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      CLICKHOUSE_ENABLED: "false"
      CLICKHOUSE_WRITE_ENABLED: "false"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: research
      CLICKHOUSE_USERNAME: api_reader
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_API_PASSWORD:-local-api-reader}
      OBJECT_STORE_ENABLED: "false"
      OBJECT_STORE_WRITE_ENABLED: "false"
      OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_API_ACCESS_KEY_ID:-local-api-artifacts}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_API_SECRET_ACCESS_KEY:-local-api-artifacts-secret}
      OBJECT_STORE_RAW_BUCKET: trade-raw
      OBJECT_STORE_DATASETS_BUCKET: trade-datasets
      OBJECT_STORE_MODELS_BUCKET: trade-models
      OBJECT_STORE_EXPERIMENTS_BUCKET: trade-experiments
      OBJECT_STORE_EXPORTS_BUCKET: trade-exports
      FILING_QUEUE_MODE: celery
      FILING_ARTIFACT_BACKEND: s3
      FILING_S3_ENDPOINT_URL: http://minio:9000
      FILING_S3_BUCKET: lens-filings
      FILING_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      FILING_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      FILING_CHECKPOINT_SCHEMA: filing_checkpoints
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      TELEMETRY_RELEASE: ${TELEMETRY_RELEASE:-local}
      INGESTION_PROFILE: local
      UPSTOX_HISTORICAL_CONCURRENCY: ${UPSTOX_HISTORICAL_CONCURRENCY:-4}
      DATA_PIPELINE_THROTTLE_SECONDS: ${DATA_PIPELINE_THROTTLE_SECONDS:-0}
      API_CORS_ORIGINS: http://localhost:5173,http://localhost:8000
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  filing-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command:
      [
        "celery",
        "-A",
        "trade_research.filings.tasks:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=filing_intelligence",
        "--concurrency=${FILING_WORKER_CONCURRENCY:-2}",
      ]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://trade:trade@postgres:5432/trade_research
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      FILING_QUEUE_MODE: celery
      FILING_ARTIFACT_BACKEND: s3
      FILING_S3_ENDPOINT_URL: http://minio:9000
      FILING_S3_BUCKET: lens-filings
      FILING_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      FILING_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      FILING_CHECKPOINT_SCHEMA: filing_checkpoints
      FILING_WORKER_CONCURRENCY: ${FILING_WORKER_CONCURRENCY:-2}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      TELEMETRY_RELEASE: ${TELEMETRY_RELEASE:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.api
    command:
      [
        "dagster-webserver",
        "-h",
        "0.0.0.0",
        "-p",
        "3000",
        "-w",
        "/app/dagster_home/workspace.yaml",
      ]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DAGSTER_HOME: /app/dagster_home
      DATABASE_URL: postgresql+psycopg://trade:trade@postgres:5432/trade_research
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      CLICKHOUSE_ENABLED: "false"
      CLICKHOUSE_WRITE_ENABLED: "false"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: research
      CLICKHOUSE_USERNAME: dagster_writer
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_DAGSTER_PASSWORD:-local-dagster-writer}
      OBJECT_STORE_ENABLED: "false"
      OBJECT_STORE_WRITE_ENABLED: "false"
      OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_DAGSTER_ACCESS_KEY_ID:-local-dagster-artifacts}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_DAGSTER_SECRET_ACCESS_KEY:-local-dagster-artifacts-secret}
      OBJECT_STORE_RAW_BUCKET: trade-raw
      OBJECT_STORE_DATASETS_BUCKET: trade-datasets
      OBJECT_STORE_MODELS_BUCKET: trade-models
      OBJECT_STORE_EXPERIMENTS_BUCKET: trade-experiments
      OBJECT_STORE_EXPORTS_BUCKET: trade-exports
      INGESTION_PROFILE: local
      UPSTOX_HISTORICAL_CONCURRENCY: ${UPSTOX_HISTORICAL_CONCURRENCY:-4}
      DATA_PIPELINE_THROTTLE_SECONDS: ${DATA_PIPELINE_THROTTLE_SECONDS:-0}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./dagster_home:/app/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["dagster-daemon", "run", "-w", "/app/dagster_home/workspace.yaml"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DAGSTER_HOME: /app/dagster_home
      DATABASE_URL: postgresql+psycopg://trade:trade@postgres:5432/trade_research
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      CLICKHOUSE_ENABLED: "false"
      CLICKHOUSE_WRITE_ENABLED: "false"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: research
      CLICKHOUSE_USERNAME: dagster_writer
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_DAGSTER_PASSWORD:-local-dagster-writer}
      OBJECT_STORE_ENABLED: "false"
      OBJECT_STORE_WRITE_ENABLED: "false"
      OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_DAGSTER_ACCESS_KEY_ID:-local-dagster-artifacts}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_DAGSTER_SECRET_ACCESS_KEY:-local-dagster-artifacts-secret}
      OBJECT_STORE_RAW_BUCKET: trade-raw
      OBJECT_STORE_DATASETS_BUCKET: trade-datasets
      OBJECT_STORE_MODELS_BUCKET: trade-models
      OBJECT_STORE_EXPERIMENTS_BUCKET: trade-experiments
      OBJECT_STORE_EXPORTS_BUCKET: trade-exports
      INGESTION_PROFILE: local
      UPSTOX_HISTORICAL_CONCURRENCY: ${UPSTOX_HISTORICAL_CONCURRENCY:-4}
      DATA_PIPELINE_THROTTLE_SECONDS: ${DATA_PIPELINE_THROTTLE_SECONDS:-0}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./dagster_home:/app/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: trade_research
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade_research"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse:25.8.33.6-jammy
    profiles: ["research"]
    environment:
      CLICKHOUSE_DB: research
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-local-clickhouse-admin}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  clickhouse-init:
    image: clickhouse:25.8.33.6-jammy
    profiles: ["research"]
    environment:
      CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_ADMIN_USER:-admin}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-local-clickhouse-admin}
      CLICKHOUSE_MIGRATION_USER: ${CLICKHOUSE_MIGRATION_USER:-migration}
      CLICKHOUSE_MIGRATION_PASSWORD: ${CLICKHOUSE_MIGRATION_PASSWORD:-local-migration}
      CLICKHOUSE_DAGSTER_USER: ${CLICKHOUSE_DAGSTER_USER:-dagster_writer}
      CLICKHOUSE_DAGSTER_PASSWORD: ${CLICKHOUSE_DAGSTER_PASSWORD:-local-dagster-writer}
      CLICKHOUSE_API_USER: ${CLICKHOUSE_API_USER:-api_reader}
      CLICKHOUSE_API_PASSWORD: ${CLICKHOUSE_API_PASSWORD:-local-api-reader}
      CLICKHOUSE_ANALYST_USER: ${CLICKHOUSE_ANALYST_USER:-analyst_reader}
      CLICKHOUSE_ANALYST_PASSWORD: ${CLICKHOUSE_ANALYST_PASSWORD:-local-analyst-reader}
    volumes:
      - ./clickhouse/bootstrap-access.sh:/bootstrap-access.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-access.sh"]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"

  clickhouse-migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["research"]
    command: ["python", "/app/scripts/run_clickhouse_migrations.py"]
    environment:
      CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: research
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_MIGRATION_USER:-migration}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_MIGRATION_PASSWORD:-local-migration}
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-research-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      RAW_BUCKET: trade-raw
      DATASETS_BUCKET: trade-datasets
      MODELS_BUCKET: trade-models
      EXPERIMENTS_BUCKET: trade-experiments
      EXPORTS_BUCKET: trade-exports
      DAGSTER_ACCESS_KEY: ${OBJECT_STORE_DAGSTER_ACCESS_KEY_ID:-local-dagster-artifacts}
      DAGSTER_SECRET_KEY: ${OBJECT_STORE_DAGSTER_SECRET_ACCESS_KEY:-local-dagster-artifacts-secret}
      API_ACCESS_KEY: ${OBJECT_STORE_API_ACCESS_KEY_ID:-local-api-artifacts}
      API_SECRET_KEY: ${OBJECT_STORE_API_SECRET_ACCESS_KEY:-local-api-artifacts-secret}
    volumes:
      - ./minio/bootstrap-research.sh:/bootstrap-research.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-research.sh"]
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes:
      - ./ops/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started

  dbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
      - "8978:8978"
    volumes:
      - dbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  clickhouse_data:
  prometheus_data:
  dbeaver_data:
  web_node_modules:
