services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://trade:trade@postgres:5432/trade_research}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
      CLICKHOUSE_ENABLED: ${RESEARCH_STORAGE_ENABLED:-false}
      CLICKHOUSE_WRITE_ENABLED: "false"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: research
      CLICKHOUSE_USERNAME: api_reader
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_API_PASSWORD:-local-api-reader}
      OBJECT_STORE_ENABLED: ${RESEARCH_STORAGE_ENABLED:-false}
      OBJECT_STORE_WRITE_ENABLED: "false"
      OBJECT_STORE_ENDPOINT_URL: ${COMPOSE_OBJECT_STORE_ENDPOINT_URL:-http://minio:9000}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_API_ACCESS_KEY_ID:-local-api-artifacts}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_API_SECRET_ACCESS_KEY:-local-api-artifacts-secret}
      OBJECT_STORE_RAW_BUCKET: trade-raw
      OBJECT_STORE_DATASETS_BUCKET: trade-datasets
      OBJECT_STORE_EXPORTS_BUCKET: trade-exports
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      TELEMETRY_RELEASE: ${TELEMETRY_RELEASE:-local}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  dagster-webserver:
    profiles: ["ingestion"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command:
      [
        "dagster-webserver",
        "-h",
        "0.0.0.0",
        "-p",
        "3000",
        "-w",
        "/app/dagster_home/workspace.yaml",
      ]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DAGSTER_HOME: /app/dagster_home
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://trade:trade@postgres:5432/trade_research}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
      CLICKHOUSE_ENABLED: ${RESEARCH_STORAGE_ENABLED:-false}
      CLICKHOUSE_WRITE_ENABLED: ${RESEARCH_STORAGE_ENABLED:-false}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: research
      CLICKHOUSE_USERNAME: dagster_writer
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_DAGSTER_PASSWORD:-local-dagster-writer}
      OBJECT_STORE_ENABLED: ${RESEARCH_STORAGE_ENABLED:-false}
      OBJECT_STORE_WRITE_ENABLED: ${RESEARCH_STORAGE_ENABLED:-false}
      OBJECT_STORE_ENDPOINT_URL: ${COMPOSE_OBJECT_STORE_ENDPOINT_URL:-http://minio:9000}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_DAGSTER_ACCESS_KEY_ID:-local-dagster-artifacts}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_DAGSTER_SECRET_ACCESS_KEY:-local-dagster-artifacts-secret}
      OBJECT_STORE_RAW_BUCKET: trade-raw
      OBJECT_STORE_DATASETS_BUCKET: trade-datasets
      OBJECT_STORE_EXPORTS_BUCKET: trade-exports
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./dagster_home:/app/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dagster-daemon:
    profiles: ["ingestion"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["dagster-daemon", "run", "-w", "/app/dagster_home/workspace.yaml"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DAGSTER_HOME: /app/dagster_home
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://trade:trade@postgres:5432/trade_research}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
      CLICKHOUSE_ENABLED: ${RESEARCH_STORAGE_ENABLED:-false}
      CLICKHOUSE_WRITE_ENABLED: ${RESEARCH_STORAGE_ENABLED:-false}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: research
      CLICKHOUSE_USERNAME: dagster_writer
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_DAGSTER_PASSWORD:-local-dagster-writer}
      OBJECT_STORE_ENABLED: ${RESEARCH_STORAGE_ENABLED:-false}
      OBJECT_STORE_WRITE_ENABLED: ${RESEARCH_STORAGE_ENABLED:-false}
      OBJECT_STORE_ENDPOINT_URL: ${COMPOSE_OBJECT_STORE_ENDPOINT_URL:-http://minio:9000}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_DAGSTER_ACCESS_KEY_ID:-local-dagster-artifacts}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_DAGSTER_SECRET_ACCESS_KEY:-local-dagster-artifacts-secret}
      OBJECT_STORE_RAW_BUCKET: trade-raw
      OBJECT_STORE_DATASETS_BUCKET: trade-datasets
      OBJECT_STORE_EXPORTS_BUCKET: trade-exports
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./dagster_home:/app/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: trade_research
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade_research"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse:25.8.33.6-jammy
    profiles: ["research"]
    environment:
      CLICKHOUSE_DB: research
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-local-clickhouse-admin}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  clickhouse-init:
    image: clickhouse:25.8.33.6-jammy
    profiles: ["research"]
    environment:
      CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_ADMIN_USER:-admin}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-local-clickhouse-admin}
      CLICKHOUSE_MIGRATION_USER: ${CLICKHOUSE_MIGRATION_USER:-migration}
      CLICKHOUSE_MIGRATION_PASSWORD: ${CLICKHOUSE_MIGRATION_PASSWORD:-local-migration}
      CLICKHOUSE_DAGSTER_USER: ${CLICKHOUSE_DAGSTER_USER:-dagster_writer}
      CLICKHOUSE_DAGSTER_PASSWORD: ${CLICKHOUSE_DAGSTER_PASSWORD:-local-dagster-writer}
      CLICKHOUSE_API_USER: ${CLICKHOUSE_API_USER:-api_reader}
      CLICKHOUSE_API_PASSWORD: ${CLICKHOUSE_API_PASSWORD:-local-api-reader}
      CLICKHOUSE_ANALYST_USER: ${CLICKHOUSE_ANALYST_USER:-analyst_reader}
      CLICKHOUSE_ANALYST_PASSWORD: ${CLICKHOUSE_ANALYST_PASSWORD:-local-analyst-reader}
    volumes:
      - ./clickhouse/bootstrap-access.sh:/bootstrap-access.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-access.sh"]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"

  clickhouse-migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["research"]
    command: ["python", "/app/scripts/run_clickhouse_migrations.py"]
    environment:
      CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: research
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_MIGRATION_USER:-migration}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_MIGRATION_PASSWORD:-local-migration}
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    profiles: ["research"]
    image: trade-minio:RELEASE.2025-09-07T16-13-09Z
    build:
      context: .
      dockerfile: minio/Dockerfile.minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      # Passed only when explicitly set; static keys are test/evaluation only.
      - MINIO_KMS_SECRET_KEY
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-research-init:
    profiles: ["research"]
    image: trade-minio-mc:RELEASE.2025-08-13T08-35-41Z
    build:
      context: .
      dockerfile: minio/Dockerfile.mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      RAW_BUCKET: trade-raw
      DATASETS_BUCKET: trade-datasets
      EXPORTS_BUCKET: trade-exports
      DAGSTER_ACCESS_KEY: ${OBJECT_STORE_DAGSTER_ACCESS_KEY_ID:-local-dagster-artifacts}
      DAGSTER_SECRET_KEY: ${OBJECT_STORE_DAGSTER_SECRET_ACCESS_KEY:-local-dagster-artifacts-secret}
      API_ACCESS_KEY: ${OBJECT_STORE_API_ACCESS_KEY_ID:-local-api-artifacts}
      API_SECRET_KEY: ${OBJECT_STORE_API_SECRET_ACCESS_KEY:-local-api-artifacts-secret}
    volumes:
      - ./minio/bootstrap-research.sh:/bootstrap-research.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-research.sh"]
    restart: "no"

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes:
      - ./ops/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started

  dbeaver:
    profiles: ["admin"]
    image: dbeaver/cloudbeaver:latest
    ports:
      - "8978:8978"
    volumes:
      - dbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  clickhouse_data:
  prometheus_data:
  dbeaver_data:
