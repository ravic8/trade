services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://trade:trade@postgres:5432/trade_research
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      INGESTION_PROFILE: local
      UPSTOX_HISTORICAL_CONCURRENCY: ${UPSTOX_HISTORICAL_CONCURRENCY:-4}
      DATA_PIPELINE_THROTTLE_SECONDS: ${DATA_PIPELINE_THROTTLE_SECONDS:-0}
      API_CORS_ORIGINS: http://localhost:5173,http://localhost:8000
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.api
    command:
      [
        "dagster-webserver",
        "-h",
        "0.0.0.0",
        "-p",
        "3000",
        "-w",
        "/app/dagster_home/workspace.yaml",
      ]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DAGSTER_HOME: /app/dagster_home
      DATABASE_URL: postgresql+psycopg://trade:trade@postgres:5432/trade_research
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      INGESTION_PROFILE: local
      UPSTOX_HISTORICAL_CONCURRENCY: ${UPSTOX_HISTORICAL_CONCURRENCY:-4}
      DATA_PIPELINE_THROTTLE_SECONDS: ${DATA_PIPELINE_THROTTLE_SECONDS:-0}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./dagster_home:/app/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["dagster-daemon", "run", "-w", "/app/dagster_home/workspace.yaml"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DATA_DIR: /app/data
      DAGSTER_HOME: /app/dagster_home
      DATABASE_URL: postgresql+psycopg://trade:trade@postgres:5432/trade_research
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      INGESTION_PROFILE: local
      UPSTOX_HISTORICAL_CONCURRENCY: ${UPSTOX_HISTORICAL_CONCURRENCY:-4}
      DATA_PIPELINE_THROTTLE_SECONDS: ${DATA_PIPELINE_THROTTLE_SECONDS:-0}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./dagster_home:/app/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: trade_research
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade_research"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  dbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
      - "8978:8978"
    volumes:
      - dbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  dbeaver_data:
  web_node_modules:
