global:
  resolve_timeout: 1m

route:
  receiver: filing-alert-audit
  group_by: [alertname, drill_id]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 4h

receivers:
  - name: filing-alert-audit
    webhook_configs:
      - url: http://api:8000/api/filings/alerts/webhook
        send_resolved: true
        max_alerts: 20
        timeout: 10s
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alertmanager_webhook_token
