[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-data"
version = "0.1.0"
description = "Daily equity data ingestion and operations backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "boto3>=1.35,<2",
  "clickhouse-connect>=0.8,<1",
  "cryptography>=43.0",
  "dagster>=1.9",
  "dagster-webserver>=1.9",
  "fastapi>=0.115",
  "httpx>=0.27",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-instrumentation-redis>=0.50b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<1",
  "opentelemetry-sdk>=1.30,<2",
  "numpy>=2",
  "pandas>=2.2",
  "pandas-market-calendars>=5.4,<6",
  "psycopg[binary]>=3.2",
  "pyarrow>=18.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "rich>=13.9",
  "sqlalchemy>=2.0",
  "tenacity>=9.0",
  "typer>=0.15",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6,<8",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.coverage.run]
branch = true
source = ["trade_data"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true

[project.scripts]
trade-data = "trade_data.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_data"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
