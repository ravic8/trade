[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-research"
version = "0.1.0"
description = "Market research agent for exchange universes, market data, screeners, and AI-assisted research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "dagster>=1.9",
  "dagster-webserver>=1.9",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "lightgbm>=4.6",
  "openai>=1.60",
  "pandas>=2.2",
  "polars>=1.15",
  "psycopg[binary]>=3.2",
  "pyarrow>=18.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "qdrant-client>=1.12",
  "rich>=13.9",
  "scikit-learn>=1.9",
  "selectolax>=0.3",
  "sqlalchemy>=2.0",
  "tenacity>=9.0",
  "trafilatura>=1.12",
  "typer>=0.15",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
trade-research = "trade_research.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_research"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
